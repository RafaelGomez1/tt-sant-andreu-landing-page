[build]
  command   = "npm run build"
  publish   = "dist"

# Force trailing slash for canonical consistency
[[redirects]]
  from   = "https://www.tt-sant-andreu.netlify.app/*"
  to     = "https://tt-sant-andreu.netlify.app/:splat"
  status = 301
  force  = true

# Cache hashed assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
